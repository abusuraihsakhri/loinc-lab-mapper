name: Loinc Lab Mapper CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
        python -m pip check

    - name: Compile Python sources
      run: python -m compileall -q agents loinc_mapper.py cli.py enrichment.py simulator.py

    - name: Check JavaScript syntax
      run: |
        node --check docs/app.js
        python - <<'PY'
        from pathlib import Path
        html = Path("web/index.html").read_text(encoding="utf-8")
        script = html.split("<script>")[1].split("</script>")[0]
        Path("/tmp/loinc_console.js").write_text(script, encoding="utf-8")
        PY
        node --check /tmp/loinc_console.js

    - name: Smoke test entry points
      run: |
        loinc-lookup single creatinine
        loinc-mapper verify-audit

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
